name: Build iPAPatcher dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: |
          brew install ldid make

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          if [ ! -d "$THEOS" ]; then
            git clone --depth 1 https://github.com/theos/theos.git $THEOS
          fi
          cd $THEOS
          rm -rf sdks
          git clone --depth 1 https://github.com/theos/sdks.git sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          # Run theos update to install vendor libs
          $THEOS/bin/update-theos
          # List available SDKs to verify
          ls -la $THEOS/sdks/
          ls -la $THEOS/vendor/

      - name: Build dylib
        run: |
          cd leisu_dylib_tweak
          gmake

      - name: Show result
        run: |
          echo "=== dylib 位置 ==="
          find . -name "*.dylib" -type f 2>/dev/null
          echo "=== 文件信息 ==="
          find . -name "*.dylib" -type f -exec file {} \;
          find . -name "*.dylib" -type f -exec ls -lh {} \;
          echo "=== artifact upload will use ==="
          find . -name "*.dylib" -type f
          # The dylib is at relative path from runner root
          DYLIB_PATH=\"\$(find . -name '*.dylib' -type f | head -1)\"
          echo \"DYLIB_PATH=\$DYLIB_PATH\"
          cp \"\$DYLIB_PATH\" ./leisu_no_ads.dylib
          ls -lh ./leisu_no_ads.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: leisu_no_ads_dylib
          path: leisu_no_ads.dylib
